name: reittrainer_app
description: >
  Flutter-App für Reittrainer und deren Schüler – Terminplanung,
  Trainingsstunden-Dokumentation und Trainingsplan-Erstellung auf Basis
  von Supabase (Auth, Postgres, Row Level Security).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI
  table_calendar: ^3.1.3
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
